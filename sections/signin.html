<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/normalize.css">
    <link rel="stylesheet" href="../src/style.css">
    <link rel="stylesheet" href="../src/signin.css">
    <link rel="icon" href="/favicon.svg" type="image/x-icon">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>Sign In</title>

    <style>
        .signin {
            background-image: url('../src/assets/bg5.png');
            background-size: cover;
            background-repeat: no-repeat;
        }
    </style>

</head>

<body class="signin">
    <main>
        <section class="container">

            <div class="top">
                <img src="/favicon.svg">
                <h2>Sign In to Paalam</h2>
            </div>

            <form id="signin-form">

                <div>
                    <label>Email address</label>
                    <input type="email" id="signin-email" required> 
                </div>    

                <div>
                    <label>Password</label>
                    <input type="password" id="signin-password" required>
                </div>

                <div class="submit">
                    <input type="submit" value="Sign in">
                </div>

            </form>

            <div class="separator">Or</div>

            <div id="googleSignInBtn"></div>

            <div class="bottom">
                <p>
                    New to Paalam?
                    <a href="/signup">
                        Create an account
                    </a>
                </p>
            </div>

        </section>

    </main>

<script>
function handleCredentialResponse(response) {
    const data = parseJwt(response.credential);
    const user = {
        name: data.name,
        email: data.email,
        picture: data.picture
    };
    localStorage.setItem('paalam_user', JSON.stringify(user));
    window.location.href = '/home';
}

function parseJwt(token) {
    let base64Url = token.split('.')[1];
    let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    let jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
}

window.onload = function () {
    google.accounts.id.initialize({
        client_id: "957269107783-bmmvsgrgfm115gb986hd4mvvdtfc9gr9.apps.googleusercontent.com",
        callback: handleCredentialResponse
    });

    google.accounts.id.renderButton(
        document.getElementById("googleSignInBtn"),
        { theme: "filled_black", size: "large", width: 340 }
    );
};

document.getElementById('signin-form').addEventListener('submit', (e) => {
    e.preventDefault();

    const email = document.getElementById('signin-email').value;

    const user = {
        name: email,
        email: email,
        picture: '/account.svg',
        isDefaultIcon: true
    };

    localStorage.setItem('paalam_user', JSON.stringify(user));
    window.location.href = '/home';
});
</script>

</body>
</html>
